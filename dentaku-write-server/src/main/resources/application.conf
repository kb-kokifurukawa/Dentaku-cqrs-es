# src/main/resources/application.conf

pekko {
  # アクターが保存するイベント（Scalaのクラス）をJSON(CBOR)形式に自動変換する設定
  actor {
    serialization-bindings {
      "domain.CborSerializable" = jackson-cbor
    }
  }

  persistence {
    # イベントの保存先（Journal）として JDBC を使用する
    journal {
      plugin = "jdbc-journal"
      auto-start-journals = ["jdbc-journal"]
    }
    # 今回は使用しませんが、スナップショット（状態の定期バックアップ）の設定も必要です
    snapshot-store {
      plugin = "jdbc-snapshot-store"
      auto-start-snapshot-stores = ["jdbc-snapshot-store"]
    }
  }
}

# SQLite への接続設定
jdbc-journal {
  slick {
    profile = "slick.jdbc.SQLiteProfile$"
    db {
      # ★ ここで Write 用の DB ファイル名を指定！
      url = "jdbc:sqlite:write_side.db"
      driver = "org.sqlite.JDBC"
      connectionPool = disabled
    }
  }
}

jdbc-snapshot-store {
  slick {
    profile = "slick.jdbc.SQLiteProfile$"
    db {
      url = "jdbc:sqlite:write_side.db"
      driver = "org.sqlite.JDBC"
      connectionPool = disabled
    }
  }
}