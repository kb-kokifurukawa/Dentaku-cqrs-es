syntax = "proto3";

package calc.v1;

option go_package = "dentaku-bff/internal/pb/calc/v1;calcv1";

import "google/protobuf/timestamp.proto";

message DigitEntered {
  string digit = 1;
}

message OperatorSelected {
  string operator = 1;
}

message Calculated {
  string result = 1;
}

message Cleared {}

message Undone {}

message CalcEvent {
  oneof event {
    DigitEntered digit_entered = 1;
    OperatorSelected operator_selected = 2;
    Calculated calculated = 3;
    Cleared cleared = 4;
    Undone undone = 5;
  }
}

message EventEnvelope {
  string persistence_id = 1;
  int64 seq_nr = 2;
  google.protobuf.Timestamp timestamp = 3;
  CalcEvent event = 4;
}

message CalculatorState {
  string display_value = 1;
  optional double stored_value = 2;
  optional string current_op = 3;
  bool is_new_input = 4;
}
