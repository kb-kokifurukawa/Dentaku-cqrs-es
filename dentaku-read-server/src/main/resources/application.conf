pekko {
  # gRPC は HTTP/2 上で動くため、cleartext HTTP/2 (h2c) を有効化する
  http.server.preview.enable-http2 = on
}

# Read DB（読み取りモデル）の SQLite ファイル
read-db {
  url = "jdbc:sqlite:read_side.db"
}

# 上流の Write Server gRPC エンドポイント
write-server {
  host = "localhost"
  port = 9000
}

# 購読するペルシステンス ID
projection {
  persistence-id = "calc-1"
}
