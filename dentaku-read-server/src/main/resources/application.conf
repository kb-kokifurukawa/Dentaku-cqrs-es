pekko {
  actor {
    serialization-bindings {
      "domain.CborSerializable" = jackson-cbor
    }
  }
}

# ---------------------------------------------------------
# 1. イベントを読み取る元 (Write サーバーのDBを覗き見する設定)
# ---------------------------------------------------------
jdbc-read-journal {
  class = "org.apache.pekko.persistence.jdbc.query.JdbcReadJournalProvider"
  slick {
    profile = "slick.jdbc.SQLiteProfile$"
    db {
      # ★ WriteサーバーのDBへの相対パス（ディレクトリ構成に合わせて調整してください）
      url = "jdbc:sqlite:../dentaku-write-server/write_side.db"
      driver = "org.sqlite.JDBC"
      connectionPool = disabled
    }
  }
}

# ---------------------------------------------------------
# 2. 最新状態を保存する先 (Read サーバー専用のDBの設定)
# ---------------------------------------------------------
read-db {
  url = "jdbc:sqlite:read_side.db"
  driver = "org.sqlite.JDBC"
}